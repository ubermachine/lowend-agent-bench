name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate pluggable test cases
        run: |
          python -m lowend_bench validate

      - name: Verify CLI Help
        run: |
          python -m lowend_bench --help
          python -m lowend_bench run --help
          python -m lowend_bench validate --help
          python -m lowend_bench submit --help
